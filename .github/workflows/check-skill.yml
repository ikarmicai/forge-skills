# A pull request adds or changes one folder under skills/, and nothing else. It runs with a read-only token and no secrets,
# because a pull request can come from anyone (pull_request, never pull_request_target).
name: Check skill

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The checker comes from the base branch, so a pull request cannot change the rules it is checked by.
      - name: Take the checker from the base branch
        run: |
          if ! git show "origin/${{ github.base_ref }}:scripts/catalog.mjs" > "$RUNNER_TEMP/catalog.mjs"; then
            echo "The base branch has no checker yet (this is the pull request that adds it)."
            echo "NO_CHECKER=1" >> "$GITHUB_ENV"
          fi
      - name: Check the skill folder
        if: env.NO_CHECKER != '1'
        run: node "$RUNNER_TEMP/catalog.mjs" check "origin/${{ github.base_ref }}"
